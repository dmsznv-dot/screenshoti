name: Screenshoti
options:
  bundleIdPrefix: com.dmsznv
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
targets:
  Screenshoti:
    type: application
    platform: macOS
    sources:
      - path: Sources/Screenshoti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmsznv.screenshoti
        PRODUCT_NAME: Screenshoti
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Sources/Screenshoti/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Screenshoti/Resources/Screenshoti.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: 5.9
