name: Build macOS DMG Installer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .app and .dmg Installer
        run: |
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenshoti-macOS-DMG-Installer
          path: Screenshoti-1.0.0-Installer.dmg
