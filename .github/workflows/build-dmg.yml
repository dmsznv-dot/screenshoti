name: Verify and package macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-dmg:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test editor and export regressions
        run: bash scripts/test.sh
        env:
          SCREENSHOTI_TEST_ARTIFACTS: ${{ runner.temp }}/screenshoti-tests
      - name: Build application and installer
        if: matrix.os == 'macos-26'
        run: bash build_dmg.sh --arch arm64 --arch x86_64
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-26'
        with:
          name: Screenshoti-macOS-installer
          path: Screenshoti-*-Installer.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/screenshoti-tests
          if-no-files-found: ignore
