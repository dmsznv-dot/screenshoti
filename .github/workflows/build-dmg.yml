name: Verify and package macOS app
on:
  push:
    branches: [main, codex/editor-polish]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test editor and export regressions
        run: bash scripts/test.sh
        env:
          SCREENSHOTI_TEST_ARTIFACTS: ${{ runner.temp }}/screenshoti-tests
      - name: Build application and installer
        run: bash build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshoti-macOS-installer
          path: Screenshoti-*-Installer.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-diagnostics
          path: ${{ runner.temp }}/screenshoti-tests
          if-no-files-found: ignore
